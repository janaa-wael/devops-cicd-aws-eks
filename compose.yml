services:
  mysql-services:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: devops-mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --database=BucketList --execute='SELECT 1 FROM tbl_user LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  flask-app:
    build:
      context: ./FlaskApp
      dockerfile: Dockerfile
    environment:
      MYSQL_DATABASE_USER: root
      MYSQL_DATABASE_PASSWORD: root
      MYSQL_DATABASE_DB: BucketList
      MYSQL_DATABASE_HOST: mysql-services
    ports:
      - "5002:5002"
    depends_on:
      mysql-services:
        condition: service_healthy

volumes:
  mysql-data:
